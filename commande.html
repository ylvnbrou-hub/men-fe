<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Finaliser ma commande - MEN FÊ</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef8f1;
            color: #1f2933;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 720px;
            margin: auto;
            padding: 20px 15px 35px;
        }

        /* TITRE */

        .titre {
            text-align: center;
            margin: 10px 0 25px;
        }

        .titre .icone {
            width: 62px;
            height: 62px;
            margin: auto;
            border-radius: 20px;
            background: #d8f3df;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .titre h1 {
            margin-top: 12px;
            font-size: 27px;
            color: #167a49;
        }

        .titre p {
            margin-top: 6px;
            color: #6b7280;
            font-size: 14px;
        }


        /* BLOCS */

        .bloc {
            background: white;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 17px;
            box-shadow: 0 5px 18px rgba(25, 135, 84, 0.08);
        }

        .bloc-titre {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .bloc-icone {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #e0f5e7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .bloc h2 {
            font-size: 18px;
            color: #167a49;
        }


        /* FORMULAIRE */

        .champ {
            margin-bottom: 15px;
        }

        .champ:last-child {
            margin-bottom: 0;
        }

        .champ label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
            color: #374151;
        }

        .champ input,
        .champ textarea {
            width: 100%;
            border: 1px solid #d9e5dd;
            background: #f9fcfa;
            border-radius: 12px;
            padding: 13px 14px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .champ textarea {
            min-height: 85px;
            resize: vertical;
        }

        .champ input:focus,
        .champ textarea:focus {
            border-color: #42a86d;
            background: white;
            box-shadow: 0 0 0 3px rgba(66, 168, 109, 0.10);
        }


        /* PAIEMENT */

        .paiement {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .paiement input {
            display: none;
        }

        .carte-paiement {
            display: flex;
            align-items: center;
            gap: 14px;
            min-height: 68px;
            padding: 11px 14px;
            border: 1.5px solid #e1e9e4;
            border-radius: 14px;
            background: #fbfdfb;
            cursor: pointer;
            transition: 0.2s;
        }

        .carte-paiement:hover {
            border-color: #58ad79;
            transform: translateY(-1px);
        }

        .carte-paiement img {
            width: 52px;
            height: 42px;
            object-fit: contain;
            border-radius: 8px;
        }

        .icone-especes {
            width: 52px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .paiement-info {
            flex: 1;
        }

        .nom-paiement {
            font-size: 15px;
            font-weight: bold;
            color: #27332c;
        }

        .petit-texte {
            display: block;
            margin-top: 3px;
            color: #8a938e;
            font-size: 12px;
        }

        .cercle {
            width: 21px;
            height: 21px;
            border: 2px solid #ccd8d0;
            border-radius: 50%;
            position: relative;
        }

        .paiement input:checked + .carte-paiement {
            border-color: #2e9b5f;
            background: #effaf2;
            box-shadow: 0 3px 10px rgba(46, 155, 95, 0.10);
        }

        .paiement input:checked + .carte-paiement .cercle {
            border-color: #2e9b5f;
            background: #2e9b5f;
        }

        .paiement input:checked + .carte-paiement .cercle::after {
            content: "";
            position: absolute;
            width: 7px;
            height: 7px;
            background: white;
            border-radius: 50%;
            top: 5px;
            left: 5px;
        }


        /* RÉSUMÉ */

        .produit-ligne {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 13px 0;
            border-bottom: 1px solid #edf1ee;
            font-size: 14px;
        }

        .produit-ligne:last-child {
            border-bottom: none;
        }

        .produit-nom {
            color: #374151;
        }

        .produit-prix {
            font-weight: bold;
            color: #26352c;
            white-space: nowrap;
        }

        .total-ligne {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            font-size: 15px;
            color: #66736b;
        }

        .grand-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 17px;
            padding: 17px;
            border-radius: 14px;
            background: #e4f7e9;
            color: #147844;
            font-size: 21px;
            font-weight: bold;
        }


        /* MESSAGE */

        .message {
            display: none;
            padding: 13px 15px;
            margin-bottom: 17px;
            border-radius: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }

        .erreur {
            background: #ffe5e7;
            color: #a61b29;
        }

        .succes {
            background: #dcf7e5;
            color: #126b3c;
        }


        /* BOUTONS */

        .bouton {
            width: 100%;
            min-height: 54px;
            border-radius: 14px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .principal {
            background: #2d9b5f;
            color: white;
            box-shadow: 0 6px 15px rgba(45, 155, 95, 0.22);
        }

        .principal:hover {
            background: #23864f;
            transform: translateY(-1px);
        }

        .principal:active {
            transform: scale(0.99);
        }

        .principal:disabled {
            background: #9ca3af;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .retour {
            margin-top: 11px;
            background: white;
            color: #268653;
            border: 1.5px solid #cce3d4;
        }

        .retour:hover {
            background: #f3faf5;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            .container {
                padding: 14px 12px 30px;
            }

            .titre h1 {
                font-size: 24px;
            }

            .bloc {
                padding: 16px;
                border-radius: 16px;
            }

            .grand-total {
                font-size: 19px;
            }

            .carte-paiement {
                min-height: 64px;
            }

        }

    </style>

</head>


<body>

<div class="container">


    <!-- TITRE -->

    <div class="titre">

        <div class="icone">
            🛒
        </div>

        <h1>
            Finaliser ma commande
        </h1>

        <p>
            Vérifiez vos informations avant de confirmer
        </p>

    </div>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message"
    ></div>


    <!-- INFORMATIONS -->

    <div class="bloc">

        <div class="bloc-titre">

            <div class="bloc-icone">
                👤
            </div>

            <h2>
                Informations personnelles
            </h2>

        </div>


        <div class="champ">

            <label for="nom">
                Nom complet
            </label>

            <input
                type="text"
                id="nom"
                placeholder="Votre nom complet"
            >

        </div>


        <div class="champ">

            <label for="telephone">
                Numéro de téléphone
            </label>

            <input
                type="tel"
                id="telephone"
                placeholder="Ex : 07 00 00 00 00"
            >

        </div>

    </div>


    <!-- LIVRAISON -->

    <div class="bloc">

        <div class="bloc-titre">

            <div class="bloc-icone">
                📍
            </div>

            <h2>
                Adresse de livraison
            </h2>

        </div>


        <div class="champ">

            <label for="quartier">
                Quartier
            </label>

            <input
                type="text"
                id="quartier"
                placeholder="Votre quartier"
            >

        </div>


        <div class="champ">

            <label for="adresse">
                Adresse précise
            </label>

            <textarea
                id="adresse"
                placeholder="Ex : près de l'église, maison bleue..."
            ></textarea>

        </div>

    </div>


    <!-- PAIEMENT -->

    <div class="bloc">

        <div class="bloc-titre">

            <div class="bloc-icone">
                💳
            </div>

            <h2>
                Mode de paiement
            </h2>

        </div>


        <div class="paiement">


            <!-- ORANGE -->

            <input
                type="radio"
                name="paiement"
                id="orange"
                value="Orange Money"
            >

            <label
                for="orange"
                class="carte-paiement"
            >

                <img
                    src="images/orange-money.png"
                    alt="Orange Money"
                >

                <div class="paiement-info">

                    <span class="nom-paiement">
                        Orange Money
                    </span>

                    <span class="petit-texte">
                        Paiement mobile
                    </span>

                </div>

                <span class="cercle"></span>

            </label>


            <!-- MOOV -->

            <input
                type="radio"
                name="paiement"
                id="moov"
                value="Moov Money"
            >

            <label
                for="moov"
                class="carte-paiement"
            >

                <img
                    src="images/moov-money.png"
                    alt="Moov Money"
                >

                <div class="paiement-info">

                    <span class="nom-paiement">
                        Moov Money
                    </span>

                    <span class="petit-texte">
                        Paiement mobile
                    </span>

                </div>

                <span class="cercle"></span>

            </label>


            <!-- MTN -->

            <input
                type="radio"
                name="paiement"
                id="mtn"
                value="MTN Mobile Money"
            >

            <label
                for="mtn"
                class="carte-paiement"
            >

                <img
                    src="images/mtn-money.png"
                    alt="MTN Mobile Money"
                >

                <div class="paiement-info">

                    <span class="nom-paiement">
                        MTN Mobile Money
                    </span>

                    <span class="petit-texte">
                        Paiement mobile
                    </span>

                </div>

                <span class="cercle"></span>

            </label>


            <!-- WAVE -->

            <input
                type="radio"
                name="paiement"
                id="wave"
                value="Wave"
            >

            <label
                for="wave"
                class="carte-paiement"
            >

                <img
                    src="images/wave.png"
                    alt="Wave"
                >

                <div class="paiement-info">

                    <span class="nom-paiement">
                        Wave
                    </span>

                    <span class="petit-texte">
                        Paiement mobile
                    </span>

                </div>

                <span class="cercle"></span>

            </label>


            <!-- ESPÈCES -->

            <input
                type="radio"
                name="paiement"
                id="especes"
                value="Espèces à la livraison"
            >

            <label
                for="especes"
                class="carte-paiement"
            >

                <div class="icone-especes">
                    💵
                </div>

                <div class="paiement-info">

                    <span class="nom-paiement">
                        Espèces à la livraison
                    </span>

                    <span class="petit-texte">
                        Payez directement à la réception
                    </span>

                </div>

                <span class="cercle"></span>

            </label>


        </div>

    </div>


    <!-- RÉSUMÉ -->

    <div class="bloc">

        <div class="bloc-titre">

            <div class="bloc-icone">
                🧾
            </div>

            <h2>
                Résumé de la commande
            </h2>

        </div>


        <div id="listeProduits"></div>


        <div class="total-ligne">

            <span>
                Sous-total
            </span>

            <strong>
                <span id="sousTotal">
                    0
                </span>
                FCFA
            </strong>

        </div>


        <div class="total-ligne">

            <span>
                Livraison
            </span>

            <strong>
                <span id="fraisLivraison">
                    0
                </span>
                FCFA
            </strong>

        </div>


        <div class="grand-total">

            <span>
                TOTAL
            </span>

            <span>
                <span id="total">
                    0
                </span>
                FCFA
            </span>

        </div>

    </div>


    <!-- CONFIRMATION -->

    <button
        type="button"
        id="boutonCommande"
        class="bouton principal"
    >
        ✅ Confirmer la commande
    </button>


    <a
        href="panier.html"
        class="bouton retour"
    >
        ← Retour au panier
    </a>


</div>


<script>

/* =========================
   UTILISATEUR
========================= */

function recupererUtilisateur() {

    try {

        return JSON.parse(
            localStorage.getItem("utilisateur")
        ) || {};

    } catch (e) {

        return {};

    }

}


/* =========================
   PANIER
========================= */

function recupererPanier() {

    try {

        return JSON.parse(
            localStorage.getItem("panier")
        ) || [];

    } catch (e) {

        return [];

    }

}


/* =========================
   MESSAGES
========================= */

function afficherErreur(message) {

    const element =
        document.getElementById("message");

    element.textContent = message;

    element.className =
        "message erreur";

    element.style.display =
        "block";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


function afficherSucces(message) {

    const element =
        document.getElementById("message");

    element.textContent = message;

    element.className =
        "message succes";

    element.style.display =
        "block";

}


/* =========================
   CALCUL
========================= */

function calculerSousTotal(panier) {

    let total = 0;

    panier.forEach(function(produit) {

        const prix =
            Number(produit.prix) || 0;

        const quantite =
            Number(
                produit.quantite ||
                produit.qte ||
                produit.quantity ||
                1
            );

        total += prix * quantite;

    });

    return total;

}


/* =========================
   AFFICHER COMMANDE
========================= */

function afficherCommande() {

    const panier =
        recupererPanier();

    const liste =
        document.getElementById(
            "listeProduits"
        );

    const bouton =
        document.getElementById(
            "boutonCommande"
        );

    liste.innerHTML = "";


    if (panier.length === 0) {

        liste.innerHTML = `
            <p style="
                text-align:center;
                color:#777;
                padding:15px;
            ">
                Votre panier est vide.
            </p>
        `;

        bouton.disabled = true;

        return;

    }


    bouton.disabled = false;


    panier.forEach(function(produit) {

        const prix =
            Number(produit.prix) || 0;

        const quantite =
            Number(
                produit.quantite ||
                produit.qte ||
                produit.quantity ||
                1
            );

        const nom =
            produit.nom ||
            produit.name ||
            "Produit";

        const montant =
            prix * quantite;


        const ligne =
            document.createElement("div");

        ligne.className =
            "produit-ligne";


        ligne.innerHTML = `

            <span class="produit-nom">
                ${nom} × ${quantite}
            </span>

            <span class="produit-prix">
                ${montant.toLocaleString("fr-FR")} FCFA
            </span>

        `;


        liste.appendChild(ligne);

    });


    const sousTotal =
        calculerSousTotal(panier);


    const fraisLivraison =
        sousTotal >= 10000
            ? 0
            : 1000;


    const total =
        sousTotal + fraisLivraison;


    document.getElementById(
        "sousTotal"
    ).textContent =
        sousTotal.toLocaleString("fr-FR");


    document.getElementById(
        "fraisLivraison"
    ).textContent =
        fraisLivraison.toLocaleString("fr-FR");


    document.getElementById(
        "total"
    ).textContent =
        total.toLocaleString("fr-FR");

}


/* =========================
   REMPLIR UTILISATEUR
========================= */

function remplirUtilisateur() {

    const utilisateur =
        recupererUtilisateur();


    if (utilisateur.nom) {

        document.getElementById(
            "nom"
        ).value =
            utilisateur.nom;

    }


    if (utilisateur.telephone) {

        document.getElementById(
            "telephone"
        ).value =
            utilisateur.telephone;

    }


    if (utilisateur.quartier) {

        document.getElementById(
            "quartier"
        ).value =
            utilisateur.quartier;

    }


    if (utilisateur.adresse) {

        document.getElementById(
            "adresse"
        ).value =
            utilisateur.adresse;

    }

}


/* =========================
   PASSER COMMANDE
========================= */

async function passerCommande() {

    const bouton =
        document.getElementById(
            "boutonCommande"
        );


    const nom =
        document.getElementById(
            "nom"
        ).value.trim();


    const telephone =
        document.getElementById(
            "telephone"
        ).value.trim();


    const quartier =
        document.getElementById(
            "quartier"
        ).value.trim();


    const adresse =
        document.getElementById(
            "adresse"
        ).value.trim();


    const paiement =
        document.querySelector(
            'input[name="paiement"]:checked'
        );


    const panier =
        recupererPanier();


    if (!nom) {

        afficherErreur(
            "Veuillez entrer votre nom complet."
        );

        return;

    }


    if (!telephone) {

        afficherErreur(
            "Veuillez entrer votre numéro de téléphone."
        );

        return;

    }


    if (!quartier) {

        afficherErreur(
            "Veuillez entrer votre quartier."
        );

        return;

    }


    if (!adresse) {

        afficherErreur(
            "Veuillez entrer votre adresse."
        );

        return;

    }


    if (!paiement) {

        afficherErreur(
            "Veuillez choisir un mode de paiement."
        );

        return;

    }


    if (panier.length === 0) {

        afficherErreur(
            "Votre panier est vide."
        );

        return;

    }


    const sousTotal =
        calculerSousTotal(panier);


    const fraisLivraison =
        sousTotal >= 10000
            ? 0
            : 1000;


    const total =
        sousTotal + fraisLivraison;


    const utilisateur =
        recupererUtilisateur();


    const nouvelleCommande = {

        numero:
            "MF-" + Date.now(),

        date:
            new Date().toISOString(),

        client:
            utilisateur,

        clientId:
            utilisateur.id ||
            utilisateur.telephone ||
            telephone,

        nom:
            nom,

        telephone:
            telephone,

        quartier:
            quartier,

        adresse:
            adresse,

        paiement:
            paiement.value,

        panier:
            panier,

        produits:
            panier,

        sousTotal:
            sousTotal,

        fraisLivraison:
            fraisLivraison,

        total:
            total,

        statut:
            "En attente"

    };


    bouton.disabled = true;

    bouton.textContent =
        "⏳ Confirmation...";


    localStorage.setItem(
        "commande",
        JSON.stringify(
            nouvelleCommande
        )
    );


    let commandes = [];


    try {

        commandes =
            JSON.parse(
                localStorage.getItem(
                    "commandes"
                )
            ) || [];

    } catch (e) {

        commandes = [];

    }


    commandes.push(
        nouvelleCommande
    );


    localStorage.setItem(
        "commandes",
        JSON.stringify(
            commandes
        )
    );


    try {

        await fetch(
            "http://192.168.100.15:3000/commande",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(
                        nouvelleCommande
                    )
            }
        );

    } catch (erreur) {

        console.log(
            "Serveur indisponible :",
            erreur
        );

    }


    localStorage.removeItem(
        "panier"
    );


    afficherSucces(
        "✅ Votre commande a été confirmée !"
    );


    bouton.textContent =
        "✅ Commande confirmée !";


    setTimeout(function() {

        window.location.href =
            "confirmation.html";

    }, 700);

}


/* =========================
   CLIC DU BOUTON
========================= */

document
    .getElementById("boutonCommande")
    .addEventListener(
        "click",
        function() {

            passerCommande();

        }
    );


/* =========================
   DÉMARRAGE
========================= */

afficherCommande();

remplirUtilisateur();

</script>

</body>

</html>
