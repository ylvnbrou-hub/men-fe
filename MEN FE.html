<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEN FÊ - Administration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #1b5e20;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 95%;
            max-width: 1000px;
            margin: 25px auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        button {
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        .deconnexion {
            background: #c62828;
            color: white;
        }

        .commande {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .commande h3 {
            color: #1b5e20;
        }

        .produits {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
        }

        select {
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .enregistrer {
            background: #1b5e20;
            color: white;
            margin-left: 5px;
        }

        .supprimer {
            background: #c62828;
            color: white;
            margin-top: 10px;
        }

        .vide {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 12px;
        }

        .stats {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<script>
    /* Vérification de la connexion */
    if (localStorage.getItem("adminConnecte") !== "true") {
        window.location.replace("connexion-admin.html");
    }
</script>

<header>
    <h1>🛠️ MEN FÊ</h1>
    <p>Administration</p>
</header>

<div class="container">

    <div class="top">
        <h2>📦 Gestion des commandes</h2>

        <button class="deconnexion" onclick="deconnexion()">
            🚪 Déconnexion
        </button>
    </div>

    <div class="stats">
        <h2 id="nombreCommandes">0</h2>
        <p>Nombre total de commandes</p>

        <h2 id="commandesAttente">0</h2>
        <p>Commandes en attente</p>

        <h2 id="chiffreAffaires">0 F</h2>
        <p>Chiffre d'affaires</p>
    </div>

    <div id="listeCommandes"></div>

</div>

<script>

function chargerCommandes() {

    let commandes =
        JSON.parse(localStorage.getItem("commandes")) || [];

    document.getElementById("nombreCommandes").textContent =
        commandes.length;

    let attente = commandes.filter(function(commande) {
        return commande.statut === "En attente";
    }).length;

    document.getElementById("commandesAttente").textContent =
        attente;

    let chiffreAffaires = commandes.reduce(function(total, commande) {
        return total + Number(commande.total || 0);
    }, 0);

    document.getElementById("chiffreAffaires").textContent =
        chiffreAffaires.toLocaleString("fr-FR") + " F";

    let liste = document.getElementById("listeCommandes");

    if (commandes.length === 0) {

        liste.innerHTML = `
            <div class="vide">
                <h2>📭 Aucune commande</h2>
                <p>Les commandes apparaîtront ici.</p>
            </div>
        `;

        return;
    }

    liste.innerHTML = "";

    commandes.forEach(function(commande, index) {

        let produitsHTML = "";

        (commande.panier || []).forEach(function(produit) {

            let quantite = Number(produit.quantite || 1);

            let prix = Number(produit.prix || 0);

            produitsHTML += `
                <p>
                    ${produit.nom} × ${quantite}
                    — ${(prix * quantite).toLocaleString("fr-FR")} F
                </p>
            `;
        });

        let date = new Date(commande.date);

        let bloc = document.createElement("div");

        bloc.className = "commande";

        bloc.innerHTML = `

            <h3>
                📦 ${commande.numero || "Commande"}
            </h3>

            <p>
                📅 ${date.toLocaleString("fr-FR")}
            </p>

            <p>
                👤 <strong>Client :</strong>
                ${commande.nom || "Non renseigné"}
            </p>

            <p>
                📞 <strong>Téléphone :</strong>
                ${commande.telephone || "Non renseigné"}
            </p>

            <p>
                📍 <strong>Quartier :</strong>
                ${commande.quartier || "Non renseigné"}
            </p>

            <p>
                🏠 <strong>Adresse :</strong>
                ${commande.adresse || "Non renseignée"}
            </p>

            <p>
                💳 <strong>Paiement :</strong>
                ${commande.paiement || "Non renseigné"}
            </p>

            <div class="produits">

                <strong>🛒 Produits :</strong>

                ${produitsHTML}

            </div>

            <h3>
                💰 Total :
                ${Number(commande.total || 0)
                    .toLocaleString("fr-FR")} F
            </h3>

            <label>
                🔄 Statut :
            </label>

            <br>

            <select id="statut-${index}">

                <option value="En attente"
                    ${commande.statut === "En attente" ? "selected" : ""}>
                    ⏳ En attente
                </option>

                <option value="En préparation"
                    ${commande.statut === "En préparation" ? "selected" : ""}>
                    👨‍🍳 En préparation
                </option>

                <option value="En livraison"
                    ${commande.statut === "En livraison" ? "selected" : ""}>
                    🚚 En livraison
                </option>

                <option value="Livrée"
                    ${commande.statut === "Livrée" ? "selected" : ""}>
                    ✅ Livrée
                </option>

            </select>

            <button
                class="enregistrer"
                onclick="modifierStatut(${index})">

                💾 Enregistrer

            </button>

            <br>

            <button
                class="supprimer"
                onclick="supprimerCommande(${index})">

                🗑️ Supprimer

            </button>
        `;

        liste.appendChild(bloc);
    });
}


function modifierStatut(index) {

    let commandes =
        JSON.parse(localStorage.getItem("commandes")) || [];

    let nouveauStatut =
        document.getElementById("statut-" + index).value;

    commandes[index].statut = nouveauStatut;

    localStorage.setItem(
        "commandes",
        JSON.stringify(commandes)
    );

    alert("✅ Statut mis à jour !");

    chargerCommandes();
}


function supprimerCommande(index) {

    let commandes =
        JSON.parse(localStorage.getItem("commandes")) || [];

    if (!confirm("⚠️ Supprimer cette commande ?")) {
        return;
    }

    commandes.splice(index, 1);

    localStorage.setItem(
        "commandes",
        JSON.stringify(commandes)
    );

    chargerCommandes();
}


function deconnexion() {

    localStorage.removeItem("adminConnecte");

    window.location.replace("connexion-admin.html");
}


chargerCommandes();

</script>

</body>
</html>
