<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MEN FÊ - Connexion Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .connexion {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #1b5e20;
            margin-bottom: 10px;
        }

        .sous-titre {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #1b5e20;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #145218;
        }

        .erreur {
            display: none;
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            background: #ffebee;
            color: #c62828;
            text-align: center;
        }

        .retour {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1b5e20;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="connexion">

    <h1>🛠️ MEN FÊ</h1>

    <p class="sous-titre">
        Connexion administrateur
    </p>

    <form onsubmit="connexion(event)">

        <label for="identifiant">
            Identifiant
        </label>

        <input
            type="text"
            id="identifiant"
            placeholder="Entrez votre identifiant"
            required
        >

        <label for="motdepasse">
            Mot de passe
        </label>

        <input
            type="password"
            id="motdepasse"
            placeholder="Entrez votre mot de passe"
            required
        >

        <button type="submit">
            🔐 Se connecter
        </button>

    </form>

    <div id="erreur" class="erreur">
        ❌ Identifiant ou mot de passe incorrect.
    </div>

    <a href="index.html" class="retour">
        ← Retour à l'accueil
    </a>

</div>

<script>

function connexion(event) {

    event.preventDefault();

    let identifiant =
        document.getElementById("identifiant").value;

    let motDePasse =
        document.getElementById("motdepasse").value;

    /*
       Identifiants de démonstration
       
       Identifiant : admin
       Mot de passe : menfe123
    */

    if (
        identifiant === "admin" &&
        motDePasse === "menfe123"
    ) {

        localStorage.setItem(
            "adminConnecte",
            "true"
        );

        window.location.href = "admin.html";

    } else {

        document.getElementById("erreur").style.display =
            "block";
    }
}

</script>

</body>
</html>
